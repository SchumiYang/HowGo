<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><title>Accessible High Contrast Guidance</title><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pl-safe{padding-left:env(safe-area-inset-left,0px);}.pr-safe{padding-right:env(safe-area-inset-right,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary": "#7d5700", "grey-700": "#475259", "on-primary-fixed-variant": "#004e59", "on-error-container": "#93000a", "red-500": "#D45251", "secondary-500": "#F5BA4B", "secondary-container": "#fec252", "secondary-fixed-dim": "#f8bd4d", "primary-700": "#356C77", "on-secondary-container": "#725000", "inverse-primary": "#7bd3e5", "grey-400": "#91A0A8", "primary-50": "#EDF8FA", "primary": "#006876", "on-secondary-fixed-variant": "#5f4100", "on-primary-container": "#00434d", "inverse-surface": "#2c3133", "surface-bright": "#f6fafc", "on-surface": "#181c1e", "surface-tint": "#006876", "orange-300": "#F4B992", "on-surface-variant": "#3e494b", "secondary-900": "#3C2B0B", "surface-container-high": "#e5e9eb", "surface-container-low": "#f0f4f6", "primary-200": "#B4E2EA", "on-tertiary-fixed": "#301400", "secondary-600": "#E7A43C", "red-300": "#E29494", "surface-variant": "#dfe3e5", "outline-variant": "#bdc8cb", "primary-container": "#5ab4c5", "surface-container": "#eaeef0", "on-tertiary-fixed-variant": "#6f3806", "grey-200": "#CAD1D5", "on-tertiary": "#ffffff", "tertiary-fixed": "#ffdcc6", "secondary-700": "#AD7B2B", "primary-950": "#081315", "secondary-950": "#1C1304", "grey-800": "#30383D", "secondary-200": "#F8E3BC", "primary-fixed": "#a0efff", "primary-300": "#93D4DF", "tertiary-fixed-dim": "#ffb784", "on-secondary-fixed": "#271900", "secondary-800": "#74521B", "surface": "#f6fafc", "primary-fixed-dim": "#7bd3e5", "grey-50": "#F1F3F4", "secondary-300": "#F4D69E", "orange-500": "#FD853A", "primary-100": "#DBF1F5", "grey-900": "#171B1D", "surface-dim": "#d6dbdd", "error-container": "#ffdad6", "background": "#f6fafc", "grey-600": "#5E6D76", "grey-100": "#E3E7E9", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "grey-300": "#ADB8BE", "grey-950": "#0B0D0E", "primary-500": "#5AB4C5", "secondary-50": "#FDF8ED", "on-tertiary-container": "#622f00", "on-secondary": "#ffffff", "secondary-fixed": "#ffdeaa", "on-background": "#181c1e", "inverse-on-surface": "#edf1f3", "primary-400": "#71C5D5", "secondary-100": "#FCF2DF", "outline": "#6e797b", "primary-800": "#22474E", "on-primary-fixed": "#001f25", "grey-500": "#738995", "tertiary-container": "#e3965e", "error": "#ba1a1a", "primary-900": "#112629", "green-500": "#76A732", "surface-container-highest": "#dfe3e5", "primary-600": "#468D9B", "tertiary": "#8c4f1d", "on-error": "#ffffff", "secondary-400": "#F0C87C" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xl": "2rem", "margin": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "font-Caption-regular": ["PingFang TC, Roboto, sans-serif"], "font-H3-regular": ["PingFang TC, Roboto, sans-serif"], "font-H2-semibold": ["PingFang TC, Roboto, sans-serif"], "font-H3-semibold": ["PingFang TC, Roboto, sans-serif"], "font-Body-regular": ["PingFang TC, Roboto, sans-serif"], "font-H2-regular": ["PingFang TC, Roboto, sans-serif"], "font-H1-semibold": ["PingFang TC, Roboto, sans-serif"], "font-Body-semibold": ["PingFang TC, Roboto, sans-serif"], "font-H1-regular": ["PingFang TC, Roboto, sans-serif"] }, "fontSize": { "font-Caption-regular": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "font-H3-regular": ["16px", { "lineHeight": "22px", "fontWeight": "400" }], "font-H2-semibold": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "font-H3-semibold": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "font-Body-regular": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "font-H2-regular": ["24px", { "lineHeight": "32px", "fontWeight": "400" }], "font-H1-semibold": ["36px", { "lineHeight": "48px", "fontWeight": "600" }], "font-Body-semibold": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "font-H1-regular": ["36px", { "lineHeight": "48px", "fontWeight": "400" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="min-h-full bg-grey-950 text-white font-font-Body-regular text-font-Body-regular flex flex-col antialiased selection:bg-primary selection:text-white"><main class="flex-1 flex flex-col relative w-full bg-grey-950 pt-safe pb-safe pl-safe pr-safe"><div class="flex flex-col w-full relative select-none">
<!-- TOP: Compact Destination Field -->
<header class="w-full px-5 pt-6 pb-4">
<div aria-label="目前導航目的地" class="w-full bg-grey-800 rounded-xl px-5 py-3.5 flex items-center justify-start shadow-none" role="region" style="border: 2px solid #F5BA4B;">
<span class="text-secondary-500 font-font-H2-semibold text-font-H2-semibold tracking-wide truncate">
        目的地：天母體育館
      </span>
</div>
</header>
<!-- CENTER: Dominant Navigation Visual Area -->
<main class="flex-1 flex flex-col items-center justify-between px-6 pb-28 pt-2">
<!-- Instruction Text -->
<div class="w-full text-center mt-4 mb-6">
<h1 aria-live="assertive" class="text-secondary-500 font-font-H1-semibold text-center tracking-wider" style="font-size: clamp(32px, 8.5vw, 38px); line-height: 1.3; font-weight: 800;">
        前進 300 公尺後左轉
      </h1>
</div>
<!-- Oversized Angular Left-Turn Directional Arrow Graphic -->
<div class="w-full flex items-center justify-center my-auto py-2">
<svg aria-hidden="true" class="w-full max-w-[340px] h-[310px] text-secondary-500 overflow-visible" fill="currentColor" role="img" viewbox="0 0 280 320">
<!-- Pure bold 90-degree left-turning directional arrow -->
<!-- Stem goes straight up from bottom-right, takes a sharp 90-degree corner to the left, terminating in a large arrowhead -->
<path d="M 0,95 
                 L 88,30 
                 L 88,68 
                 L 194,68 
                 C 214,68 226,80 226,100 
                 L 226,305 
                 C 226,312 220,318 212,318 
                 L 164,318 
                 C 156,318 150,312 150,305 
                 L 150,144 
                 L 88,144 
                 L 88,160 
                 Z"></path>
</svg>
</div>
<!-- Generous dark void for ultimate focus and high readability -->
<div aria-hidden="true" class="h-6"></div>
</main>
<!-- BOTTOM: Fixed High-Contrast Action Bar -->
<nav aria-label="導航操作動作" class="fixed bottom-0 inset-x-0 bg-grey-800 pb-safe z-50" style="border-top: 2px solid #F5BA4B;">
<div class="grid grid-cols-2 w-full h-[92px]">
<!-- Left Action: 現在位置 -->
<button aria-label="查看現在位置" class="flex flex-col items-center justify-center h-full active:bg-secondary-400/20 focus:outline-none focus:bg-secondary-400/25 transition-colors" id="btn-current-location" style="border-right: 2px solid #F5BA4B;" type="button">
<!-- Crosshair Location SVG Icon -->
<svg aria-hidden="true" class="w-9 h-9 text-secondary-500" fill="none" stroke="#F5BA4B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="7"></circle>
<line x1="12" x2="12" y1="1" y2="5"></line>
<line x1="12" x2="12" y1="19" y2="23"></line>
<line x1="1" x2="5" y1="12" y2="12"></line>
<line x1="19" x2="23" y1="12" y2="12"></line>
</svg>
<span class="text-secondary-500 font-font-H3-semibold text-[20px] font-bold leading-none mt-1.5 tracking-wide">
          現在位置
        </span>
</button>
<!-- Right Action: 開啟地圖 -->
<button aria-label="開啟地圖顯示" class="flex flex-col items-center justify-center h-full active:bg-secondary-400/20 focus:outline-none focus:bg-secondary-400/25 transition-colors" id="btn-open-map" type="button">
<!-- Folded Map SVG Icon -->
<svg aria-hidden="true" class="w-9 h-9 text-secondary-500" fill="none" stroke="#F5BA4B" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
<line x1="8" x2="8" y1="2" y2="18"></line>
<line x1="16" x2="16" y1="6" y2="22"></line>
</svg>
<span class="text-secondary-500 font-font-H3-semibold text-[20px] font-bold leading-none mt-1.5 tracking-wide">
          開啟地圖
        </span>
</button>
</div>
</nav>
</div>
<script>
  // High contrast tactile click interaction feedback
  const locBtn = document.getElementById('btn-current-location');
  const mapBtn = document.getElementById('btn-open-map');

  function triggerHapticAndPress(btn, feedbackText) {
    if ('vibrate' in navigator) {
      navigator.vibrate(40);
    }
    const label = btn.querySelector('span');
    if (label) {
      const orig = label.innerText;
      label.innerText = feedbackText;
      setTimeout(() => {
        label.innerText = orig;
      }, 700);
    }
  }

  if (locBtn) {
    locBtn.addEventListener('click', () => {
      triggerHapticAndPress(locBtn, '定位中...');
    });
  }

  if (mapBtn) {
    mapBtn.addEventListener('click', () => {
      triggerHapticAndPress(mapBtn, '載入地圖');
    });
  }
</script></main></body></html>
