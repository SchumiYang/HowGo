<script>
  // Simple micro-interactions for input, quick chips, and software keyboard
  const inputEl = document.getElementById('origin-search-input');
  const cursorEl = document.getElementById('active-cursor');
  const actionIcon = document.getElementById('search-action-icon');

  function updateInputUI() {
    if (inputEl.value.length > 0) {
      cursorEl.style.display = 'none';
      actionIcon.innerText = 'cancel';
      actionIcon.parentElement.classList.remove('text-primary-600');
      actionIcon.parentElement.classList.add('text-grey-400');
    } else {
      cursorEl.style.display = 'block';
      actionIcon.innerText = 'search';
      actionIcon.parentElement.classList.add('text-primary-600');
      actionIcon.parentElement.classList.remove('text-grey-400');
    }
  }

  inputEl.addEventListener('input', updateInputUI);

  document.getElementById('clear-or-search-btn').addEventListener('click', () => {
    if (inputEl.value.length > 0) {
      inputEl.value = '';
      inputEl.focus();
      updateInputUI();
    }
  });

  function setInputValue(val) {
    inputEl.value = val;
    updateInputUI();
    inputEl.focus();
  }

  function handleBackspace() {
    inputEl.value = inputEl.value.slice(0, -1);
    updateInputUI();
  }

  function handleSpace() {
    inputEl.value += ' ';
    updateInputUI();
  }

  function confirmOriginSelection() {
    const target = inputEl.value.trim() || '目前所在位置 (GPS)';
    // Visual subtle flash feedback
    const btn = document.getElementById('btn-keyboard-search');
    btn.classList.add('opacity-80', 'scale-95');
    setTimeout(() => {
      btn.classList.remove('opacity-80', 'scale-95');
      // Navigate to destination / route planning view
      history.back();
    }, 150);
  }

  document.getElementById('btn-current-location').addEventListener('click', () => {
    setInputValue('你的位置 (GPS 定位中)');
  });

  document.getElementById('btn-pick-on-map').addEventListener('click', () => {
    setInputValue('地圖選取點 (25.0478, 121.5170)');
  });
</script></main>
