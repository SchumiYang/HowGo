<div class="absolute w-4 h-4 rounded-full border-2 border-red-500/80 -top-0.5"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-red-500"></div>
</div>
</div>
</div>
<!-- Floating Map Controls (Right Side, Elevation 1) -->
<div class="absolute right-4 bottom-28 flex flex-col gap-3 z-30 pointer-events-auto">
<!-- Re-Center to Current GPS Button -->

<!-- Zoom Controls (+ / -) Stack -->
<div class="flex flex-col bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.12)] overflow-hidden divide-y divide-grey-100">


</div>
</div>
<!-- Floating Compass / Orientation Widget (Top Right) -->
<div class="absolute top-4 right-4 z-30 pointer-events-auto">

</div>
<!-- Map Pan Drag Hint Overlay (Disappears after first touch) -->
<div class="absolute bottom-28 left-4 z-20 pointer-events-none flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-lowest/90 shadow-[0_2px_8px_rgba(0,0,0,0.06)] text-grey-600 transition-opacity duration-300" id="pan-hint">
<span class="material-symbols-outlined text-[16px] text-primary">drag_pan</span>
<span class="font-font-Caption-regular text-font-Caption-regular">拖曳地圖調整中心點</span>
</div>
</div>
<!-- Fixed Bottom Confirmation Bar (Elevation 2) -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.06)] px-margin py-3 pb-safe">
<div class="max-w-md mx-auto flex flex-col gap-2">
<!-- Accessible Confirmation Button matching Town Pass Primary #5AB4C5 -->
<button aria-label="確定選擇此起點位置" class="w-full h-14 bg-primary-500 hover:bg-primary-600 active:bg-primary-700 text-on-primary font-font-H3-semibold text-font-H3-semibold rounded-xl flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(90,180,197,0.35)] active:scale-[0.99] transition-all cursor-pointer" id="btn-confirm-location" type="button">
<span class="">確定</span>
</button>
</div>
</div>
</div>
<script>
  (function () {
    const viewport = document.getElementById('map-viewport');
    const mapLayer = document.getElementById('map-layer');
    const hint = document.getElementById('pan-hint');
    const btnRecenter = document.getElementById('btn-recenter');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnConfirm = document.getElementById('btn-confirm-location');

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;
    let scale = 1;

    function updateTransform() {
      if (mapLayer) {
        mapLayer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(${scale})`;
      }
    }

    // Touch and Drag handling for fluid pan interaction
    viewport.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      viewport.setPointerCapture(e.pointerId);
      if (hint) {
        hint.style.opacity = '0';
      }
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      updateTransform();
    });

    const stopDragging = (e) => {
      if (isDragging) {
        isDragging = false;
        try {
          viewport.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    };

    viewport.addEventListener('pointerup', stopDragging);
    viewport.addEventListener('pointercancel', stopDragging);

    // Zoom Controls
    if (btnZoomIn) {
      btnZoomIn.addEventListener('click', () => {
        scale = Math.min(scale + 0.15, 1.6);
        updateTransform();
      });
    }

    if (btnZoomOut) {
      btnZoomOut.addEventListener('click', () => {
        scale = Math.max(scale - 0.15, 0.75);
        updateTransform();
      });
    }

    // Recenter smoothly
    if (btnRecenter) {
      btnRecenter.addEventListener('click', () => {
        currentX = 0;
        currentY = 0;
        scale = 1;
        if (mapLayer) {
          mapLayer.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1)';
          updateTransform();
          setTimeout(() => {
            mapLayer.style.transition = 'transform 75ms ease-out';
          }, 320);
        }
      });
    }

    // Confirmation Action
    if (btnConfirm) {
      btnConfirm.addEventListener('click', () => {
        // Return to Page 2 (or previous route formulation)
        if (window.history.length > 1) {
          window.history.back();
        }
      });
    }
  })();
</script></main></body></html>
